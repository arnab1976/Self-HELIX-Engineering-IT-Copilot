apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-api
  labels: { app: helix-api }
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: helix-api }
  template:
    metadata:
      labels: { app: helix-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000" }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8000 }]
          env:
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
            {{- range .Values.secretEnv }}
            - name: {{ . }}
              valueFrom: { secretKeyRef: { name: helix-secrets, key: {{ . }} } }
            {{- end }}
          readinessProbe: { httpGet: { path: /healthz, port: 8000 }, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { runAsNonRoot: true, runAsUser: 10001, readOnlyRootFilesystem: false, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: helix-api }
spec:
  selector: { app: helix-api }
  ports: [{ port: 80, targetPort: 8000 }]
