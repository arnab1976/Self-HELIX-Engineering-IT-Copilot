[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-engit-copilot"
version = "0.1.0"
description = "HELIX: Enterprise Engineering & IT Copilot built on LEXORA (model adaptation) and NEXUS (AI gateway). UC-3 reference implementation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Feuji AI Practice" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "sqlglot>=23.0",
  "prometheus-client>=0.20",
  "PyJWT>=2.8",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
# Data preparation with the production libraries (pure-Python fallbacks are used when absent)
prep = ["datasketch>=1.6", "drain3>=0.9", "presidio-analyzer>=2.2", "presidio-anonymizer>=2.2",
        "tree-sitter>=0.22", "tree-sitter-language-pack>=0.2", "detect-secrets>=1.5"]
# Classic ML for L8 / L9 explanations
ml = ["lightgbm>=4.3", "shap>=0.45", "optuna>=3.6"]
# GPU training for L1-L7 (install on a CUDA machine)
train = ["torch>=2.3", "transformers>=4.44", "datasets>=2.20", "peft>=0.12", "trl>=0.12",
         "bitsandbytes>=0.43", "accelerate>=0.33", "sentence-transformers>=3.0", "mlflow>=2.14"]
# External stores used by the docker-compose stack
stores = ["qdrant-client>=1.9", "opensearch-py>=2.6", "neo4j>=5.20", "redis>=5.0", "psycopg[binary]>=3.1"]
# Agents, tools, observability
agents = ["mcp>=1.2", "langfuse>=2.36", "opentelemetry-sdk>=1.25", "slack-bolt>=1.19"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["common*", "lexora*", "nexus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
